<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#091927">
  <title>Globe · Mizan</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #091927;
      -webkit-user-select: none;
      user-select: none;
    }
    #atlas {
      width: 100%;
      height: 100%;
      margin: 0;
      max-width: none;
    }
  </style>
</head>
<body class="atlas-fullscreen">
  <main id="atlas"></main>
  <script type="module">
    import {mountAtlas} from './atlas.js';
    mountAtlas(document.getElementById('atlas'), {
      fullscreen: true,
      onNews: window.webkit?.messageHandlers?.atlasNews
        ? event => window.webkit.messageHandlers.atlasNews.postMessage({alert_id: event.alert_id || event.id})
        : undefined
    });
  </script>
</body>
</html>
