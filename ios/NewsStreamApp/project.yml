name: MyNewsAI
options:
  bundleIdPrefix: com.issam.mynewsai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MyNewsAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/NewsStreamApp
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "MyNews AI"
        CFBundleIdentifier: "com.issam.mynewsai.news"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.issam.mynewsai.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.issam.mynewsai.news
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: "8J2NC2B544"
